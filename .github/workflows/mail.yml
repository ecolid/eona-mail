name: Mail GitHub platform verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  platform:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Verify GitHub event and repository identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/local-ci.py platform
